<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48">
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.15)"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0.05)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.12)"/>
    </linearGradient>
  </defs>
  <!-- Glass circle -->
  <circle cx="24" cy="24" r="20" fill="url(#glass)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <!-- Inner dot-matrix ring -->
  <circle cx="24" cy="24" r="14" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1" stroke-dasharray="3 3"/>
  <!-- Center accent dot -->
  <circle cx="24" cy="24" r="5" fill="#ff3030"/>
  <!-- Outer glow -->
  <circle cx="24" cy="24" r="20" fill="none" stroke="#ff3030" stroke-width="0.5" opacity="0.3"/>
  <!-- Text: NeoAbs -->
  <text x="56" y="30" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="700" fill="white" letter-spacing="-0.5">Neo</text>
  <text x="104" y="30" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="700" fill="#ff3030" letter-spacing="-0.5">Abs</text>
</svg>
