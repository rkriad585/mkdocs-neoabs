<div class="neoabs-search" data-md-component="search" role="dialog" aria-modal="true" aria-label="Search" aria-hidden="true">
  <label class="neoabs-search__overlay" for="neoabs-search" tabindex="-1" aria-hidden="true"></label>

  <div class="neoabs-search__inner">
    <div class="neoabs-search__glass">
      <div class="neoabs-search__input-wrapper">
        <svg class="neoabs-search__icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
          <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
        </svg>
        <input class="neoabs-search__input" id="neoabs-search-input" type="search" placeholder="{{ _search_placeholder }}" aria-label="Search" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-controls="neoabs-search-results" aria-activedescendant="">
        <button type="button" class="neoabs-search__close" aria-label="Close search">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
            <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
          </svg>
        </button>
      </div>

      <div class="neoabs-search__results" id="neoabs-search-results">
        <div class="neoabs-search__status">
          <p>{{ _i18n.get("search", {}).get("startTyping", "Start typing to search...") if (_i18n is mapping) else "Start typing to search..." }}</p>
        </div>
        <div class="neoabs-search__list" role="listbox" aria-label="{{ _i18n.get("search", {}).get("results", "Search results") if (_i18n is mapping) else "Search results" }}"></div>
      </div>

      <!-- Phase 3: per-result "copy link" share button markup, cloned by
           buildResults() in neoabs.js (deep links re-open search via ?q=). -->
      <template id="neoabs-search-share">
        <button type="button" class="neoabs-search__result-share" aria-label="Copy link to this result" title="Copy link">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true">
            <path d="M3.9 12c0-1.71 1.39-3.1 3.1-3.1h4V7H7c-2.76 0-5 2.24-5 5s2.24 5 5 5h4v-1.9H7c-1.71 0-3.1-1.39-3.1-3.1zM8 13h8v-2H8v2zm9-6h-4v1.9h4c1.71 0 3.1 1.39 3.1 3.1s-1.39 3.1-3.1 3.1h-4V17h4c2.76 0 5-2.24 5-5s-2.24-5-5-5z"/>
          </svg>
        </button>
      </template>

      <div class="neoabs-search__footer">
        {% if _search_show_shortcuts %}
        <div class="neoabs-search__shortcuts">
          <span class="neoabs-search__shortcut">
            <kbd>ESC</kbd> to close
          </span>
          <span class="neoabs-search__shortcut">
            <kbd>&uarr;</kbd> <kbd>&darr;</kbd> to navigate
          </span>
          <span class="neoabs-search__shortcut">
            <kbd>&crarr;</kbd> to select
          </span>
          <span class="neoabs-search__shortcut">
            <kbd>?</kbd> for shortcuts
          </span>
        </div>
        {% endif %}
      </div>
    </div>
  </div>
</div>
