<header class="neoabs-header" data-md-component="header">
  <div class="neoabs-header__inner">
    <div class="neoabs-header__left">
      {% if config.theme.logo %}
      <a href="{{ config.site_url | default('/', true) | url }}" class="neoabs-header__logo" title="{{ config.site_name }}">
        <img src="{{ config.theme.logo | url }}" alt="{{ config.site_name }}" width="28" height="28">
      </a>
      {% endif %}
      <a href="{{ config.site_url | default('/', true) | url }}" class="neoabs-header__title" title="{{ config.site_name }}">
        <span class="neoabs-header__site-name">{{ config.site_name }}</span>
        {% if page.meta and page.meta.title %}
        <span class="neoabs-header__page-title">{{ page.meta.title }}</span>
        {% elif page.title %}
        <span class="neoabs-header__page-title">{{ page.title }}</span>
        {% endif %}
      </a>
    </div>

    <div class="neoabs-header__center">
      <label class="neoabs-header__hamburger" for="neoabs-drawer" tabindex="0" aria-label="Toggle navigation" role="button">
        <span></span>
        <span></span>
        <span></span>
      </label>
    </div>

    <div class="neoabs-header__right">
      {% include "partials/palette.html" %}

      {% if "search" in config.plugins %}
      <label class="neoabs-header__search" for="neoabs-search" tabindex="0" aria-label="Toggle search" role="button">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
          <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
        </svg>
      </label>
      {% endif %}

      {% if config.repo_url %}
      <a href="{{ config.repo_url }}" class="neoabs-header__repo" target="_blank" rel="noopener" title="{{ config.repo_name | default('Repository') }}">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
          {% if "github" in config.repo_url %}
          <path d="M12 2A10 10 0 0 0 2 12c0 4.42 2.87 8.17 6.84 9.5.5.08.66-.23.66-.5v-1.69c-2.77.6-3.36-1.34-3.36-1.34-.46-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.87 1.52 2.34 1.07 2.91.83.09-.65.35-1.09.63-1.34-2.22-.25-4.55-1.11-4.55-4.92 0-1.11.38-2 1.03-2.71-.1-.25-.45-1.29.1-2.64 0 0 .84-.27 2.75 1.02.79-.22 1.65-.33 2.5-.33.85 0 1.71.11 2.5.33 1.91-1.29 2.75-1.02 2.75-1.02.55 1.35.2 2.39.1 2.64.65.71 1.03 1.6 1.03 2.71 0 3.82-2.34 4.66-4.57 4.91.36.31.69.92.69 1.85V21c0 .27.16.59.67.5C19.14 20.16 22 16.42 22 12A10 10 0 0 0 12 2z"/>
          {% elif "gitlab" in config.repo_url %}
          <path d="M22.65 14.39L12 22.13 1.35 14.39a.84.84 0 0 1-.3-.94l1.22-3.78 2.44-7.51A.42.42 0 0 1 4.82 2a.43.43 0 0 1 .58 0 .42.42 0 0 1 .11.18l2.44 7.49h8.1l2.44-7.51A.42.42 0 0 1 18.6 2a.43.43 0 0 1 .58 0 .42.42 0 0 1 .11.18l2.44 7.51L23 13.45a.84.84 0 0 1-.35.94z"/>
          {% else %}
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
          {% endif %}
        </svg>
      </a>
      {% endif %}
    </div>
  </div>
</header>
