site_name: NeoAbs Documentation
site_description: Glass + NothingOS Design Language for MkDocs
site_url: https://rkriad585.github.io/mkdocs-neoabs

repo_url: https://github.com/rkriad585/mkdocs-neoabs
repo_name: rkriad585/mkdocs-neoabs

copyright: "&copy; 2025 rkriad585. Built with NeoAbs."

theme:
  name: neoabs
  logo: assets/images/logo.svg
  favicon: assets/images/favicon.svg
  language: en
  direction: ltr
  palette:
    - scheme: slate
      primary: black
      accent: red
      toggle:
        name: Switch to light mode
    - scheme: default
      primary: white
      accent: red
      toggle:
        name: Switch to dark mode
  font:
    text: Space Grotesk
    code: Space Mono
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.suggest
    - search.highlight
  neoabs:
    glass: medium
    dot_matrix: true
    animation: normal
    border: thin
    # --- Phase 1: Design token overrides (optional) -------------------------
    # Uncomment any value to override the theme's default design token. Values
    # map to CSS custom properties and win against the compiled stylesheet.
    # colors:
    #   primary: "#ff3030"            # --neoabs-accent
    #   primary_light: "#ff6b6b"      # --neoabs-accent-glow
    #   primary_dark: "#c62828"       # --neoabs-accent-strong
    #   background: "#000000"         # --neoabs-ink
    #   surface: "rgba(255,255,255,0.08)"   # --neoabs-glass-bg
    #   surface_light: "rgba(255,255,255,0.15)" # --neoabs-glass-bg-strong
    #   text: "#ffffff"               # --neoabs-text-primary
    #   text_secondary: "#aaaaaa"     # --neoabs-text-secondary
    #   border: "rgba(255,255,255,0.18)"    # --neoabs-glass-border
    #   overlay: "rgba(0,0,0,0.5)"    # --neoabs-overlay-color
    # typography:
    #   font_family: "Space Grotesk, sans-serif"
    #   font_family_display: "Space Grotesk, sans-serif"
    #   font_family_mono: "Space Mono, monospace"
    #   font_size_base: "16px"
    #   font_size_sm: "14px"
    #   font_size_lg: "18px"
    #   line_height: "1.7"
    #   heading_weight: "700"
    #   heading_letter_spacing: "-0.02em"
    # spacing:
    #   sidebar_width: "280px"
    #   toc_width: "240px"
    #   header_height: "56px"
    #   content_max_width: "900px"
    #   content_padding: "40px 32px"
    #   section_gap: "40px"
    # border_radius:
    #   small: "4px"
    #   medium: "8px"
    #   large: "12px"
    # transitions:
    #   duration: "250ms"
    #   easing: "cubic-bezier(0.4, 0, 0.2, 1)"
    # shadows:
    #   small: "0 1px 2px rgba(0,0,0,0.3)"
    #   medium: "0 4px 12px rgba(0,0,0,0.4)"
    #   large: "0 8px 32px rgba(0,0,0,0.5)"

extra:
  neoabs_version: 3
  neoabs_logo_dark: https://raw.githubusercontent.com/rkriad585/mkdocs-neoabs/main/logo/logo.svg
  neoabs_logo_light: https://raw.githubusercontent.com/rkriad585/mkdocs-neoabs/main/logo/logo-light.svg
  neoabs_favicon_dark: assets/images/favicon.svg
  neoabs_favicon_light: assets/images/favicon-light.svg

plugins:
  - search
  - neoabs

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
  - attr_list
  - md_in_html
  - def_list
  - tables
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.arithmatex:
      generic: true


nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Configuration: getting-started/configuration.md
    - Quick Start: getting-started.md
  - Design System:
    - Overview: design/overview.md
    - Colors: design/colors.md
    - Typography: design/typography.md
    - Glass Effects: design/glass.md
  - Components:
    - Admonitions: components/admonitions.md
    - Notes: components/notes.md
    - Diagrams: components/diagrams.md
    - Code Highlighting: components/code-highlighting.md
    - Trees: components/trees.md
    - Task Lists: components/task-lists.md
    - Tabs: components/tabs.md
    - Buttons: components/buttons.md
    - Cards: components/cards.md
    - Forms: components/forms.md
    - Tables: components/tables.md
    - Math: components/math.md
    - Images & SVG: components/images.md
    - Toast: components/toast.md
    - CSS Classes in Markdown: components/classes.md
    - Keyboard Shortcuts: components/shortcuts.md
  - Plugins:
    - NeoAbs Plugin: plugins/neoabs.md
  - Architecture: architecture.md
  - Development: development.md
  - Deployment: deployment.md
  - Troubleshooting: troubleshooting.md
  - FAQ: faq.md
  - Screenshots: screenshots.md
  - About: about.md
