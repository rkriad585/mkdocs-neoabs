name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build tool
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*

      - name: Promote changelog for this release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git checkout main
          git reset --hard origin/main
          python tools/emit_changelog.py --release "${{ github.ref_name }}"
          git config user.name "CI Bot"
          git config user.email "ci@example.com"
          if git diff --quiet -- CHANGELOG.md; then
            echo "changelog promotion skipped (no changes)"
          else
            git add CHANGELOG.md
            git commit -m "chore: release changelog for ${{ github.ref_name }} [skip ci]"
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" main
          fi

  publish:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Trusted publishing (OIDC) on PyPI as the default path; alternatively
      # set a PYPI_TOKEN secret and the action falls back to token auth.
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Build package
        run: pip install build && python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
          skip-existing: true
          verbose: true
