name: Performance (Lighthouse)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: treosh/lighthouse-ci-action@12.6.2
        with:
          urls: https://rkriad585.github.io/mkdocs-void/
          configPath: .lighthouseci.json
