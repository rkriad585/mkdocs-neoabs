name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "neoabs/**"
      - "mkdocs.yml"
      - "pyproject.toml"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install Python dependencies
        run: pip install -e .

      - name: Install Node dependencies
        run: npm install

      - name: Build CSS
        run: npm run build

      - name: Build documentation
        run: mkdocs build --strict --clean

      - name: Verify site
        run: |
          test -f site/index.html || { echo "ERROR: site/index.html not found"; exit 1; }
          test -f site/search/search_index.json || { echo "ERROR: search index not found"; exit 1; }
          echo "Build verified successfully"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
