name: Benchmarks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  benchmarks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e . mkdocs-material

      - name: Regenerate benchmarks page
        run: python tools/emit_benchmarks.py

      - name: Open a PR when the numbers changed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- docs/benchmarks.md; then
            echo "benchmarks unchanged"
          else
            git config user.name "CI Bot"
            git config user.email "ci@example.com"
            BRANCH="chore/benchmarks-${GITHUB_SHA:0:7}"
            git checkout -b "$BRANCH"
            git add docs/benchmarks.md
            git commit -m "chore: refresh benchmarks page"
            git push origin "$BRANCH"
            gh pr create --base main --head "$BRANCH" \
              --title "chore: refresh benchmarks page" \
              --body "Auto-regenerated by the Benchmarks workflow. Page-weight numbers updated." || \
              echo "PR creation skipped (may already exist)"
          fi